version: "3.8"

services:
  verifier:
    build:
      context: ../verifier
      dockerfile: Dockerfile
    ports:
      - "7047:7047"
    environment:
      - RUST_LOG=info
      - GIT_HASH=${GIT_HASH:-dev}
    restart: unless-stopped

  demo-static:
    build:
      context: ..
      dockerfile: demo/Dockerfile
      args:
        VITE_VERIFIER_HOST: ${VITE_VERIFIER_HOST:-localhost:7047}
        VITE_SSL: ${VITE_SSL:-false}
        GIT_HASH: ${GIT_HASH:-dev}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - verifier
      - demo-static
    restart: unless-stopped

  # ── Off-chain sweep-keeper ─────────────────────────────────────────────────
  # Watches OrderPlaced on the deployed C2CEscrow and triggers
  # sweepExpiredBatch after deadline + grace. The contract remains the source
  # of truth; the keeper is purely a convenience trigger.
  #
  # On linux, host.docker.internal needs `extra_hosts` to reach the host's
  # hardhat node. Provide `.env` next to packages/keeper/ (cp .env.example .env
  # and tweak); ESCROW_ADDRESS is auto-discovered from
  # ../contracts/deployments/<chainId>.json so a fresh deploy on the host is
  # picked up on the next keeper restart.
  keeper:
    build:
      context: ../..
      dockerfile: packages/keeper/Dockerfile
    env_file: ../keeper/.env
    environment:
      # Override RPC URLs so the container reaches the host's hardhat node
      # (the default localhost:8545 is meaningless inside the container).
      - RPC_URL_HTTP=${KEEPER_RPC_URL_HTTP:-http://host.docker.internal:8545}
      - RPC_URL_WS=${KEEPER_RPC_URL_WS:-ws://host.docker.internal:8545}
      - KEEPER_LABEL=web
      - KEEPER_DEPLOYMENTS_FILE=/deployments/web-${CHAIN_ID:-31337}.json
      - STATE_FILE_PATH=/app/packages/keeper/data/state.json
    ports:
      - "9091:9091"
    volumes:
      - ../keeper/data:/app/packages/keeper/data
      - ../contracts/deployments:/deployments:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Second sweep-keeper for the demo escrow ────────────────────────────────
  # Mirrors `keeper` but tracks the demo deployment file. Uses a separate
  # account (Hardhat account[8]) and ports so the two processes don't fight
  # over nonces or bind addresses. Optional — comment out if you only run
  # one deployment on the chain.
  keeper-demo:
    build:
      context: ../..
      dockerfile: packages/keeper/Dockerfile
    env_file: ../keeper/.env.demo
    environment:
      - RPC_URL_HTTP=${KEEPER_RPC_URL_HTTP:-http://host.docker.internal:8545}
      - RPC_URL_WS=${KEEPER_RPC_URL_WS:-ws://host.docker.internal:8545}
      - KEEPER_LABEL=demo
      - KEEPER_DEPLOYMENTS_FILE=/deployments/demo-${CHAIN_ID:-31337}.json
      - STATE_FILE_PATH=/app/packages/keeper/data/state-demo.json
      - HEALTH_PORT=9092
    ports:
      - "9092:9092"
    volumes:
      - ../keeper/data:/app/packages/keeper/data
      - ../contracts/deployments:/deployments:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
